<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lullabies · HUMS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  /*
   * Krishna palette:
   * --sand    : warm silica base (the finite, the earth, Vrindavan dust)
   * --deep    : infinite peacock-night blue (Krishna's skin, the cosmos)
   * --flute   : warm gold-amber (his flute, Yamuna sunset)
   * --peacock : vivid teal-green (peacock feather iridescence)
   * --rose    : Radha's rose-mauve (devotion, madhura bhakti)
   * --text    : deep slate on sand (readable, grounded)
   */
  :root {
    --sand:    #f0ebe0;
    --sand2:   #e8e1d3;
    --sidebar: #e2d9c8;
    --deep:    #1a2a4a;
    --flute:   #c47e1a;
    --flute2:  #e8a020;
    --peacock: #2a7a6a;
    --rose:    #9b4e6e;
    --text:    #1e1a14;
    --muted:   #6a5f50;
    --border:  rgba(36,70,110,0.15);
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(–sand);
color: var(–text);
font-family: ‘Crimson Pro’, Georgia, serif;
font-size: 18px;
min-height: 100vh;
overflow-x: hidden;
}

/* ── AMBIENT GLOW (peacock-blue wash, sand warmth) ── */
.stars {
position: fixed; inset: 0; z-index: 0; pointer-events: none;
background:
radial-gradient(ellipse at 15% 0%,   rgba(26,42,74,0.07)  0%, transparent 55%),
radial-gradient(ellipse at 85% 100%, rgba(196,126,26,0.06) 0%, transparent 50%),
radial-gradient(ellipse at 50% 50%,  rgba(42,122,106,0.04) 0%, transparent 70%);
}
.stars::before {
content: ‘’;
position: absolute; inset: 0;
background-image:
radial-gradient(1.5px 1.5px at 12% 18%, rgba(42,122,106,0.5)  0%, transparent 100%),
radial-gradient(1px   1px   at 40% 6%,  rgba(196,126,26,0.45) 0%, transparent 100%),
radial-gradient(1.5px 1.5px at 68% 22%, rgba(26,42,74,0.3)    0%, transparent 100%),
radial-gradient(1px   1px   at 82% 10%, rgba(155,78,110,0.35) 0%, transparent 100%),
radial-gradient(1px   1px   at 25% 45%, rgba(42,122,106,0.25) 0%, transparent 100%),
radial-gradient(1.5px 1.5px at 90% 50%, rgba(196,126,26,0.3)  0%, transparent 100%),
radial-gradient(1px   1px   at 55% 75%, rgba(26,42,74,0.2)    0%, transparent 100%),
radial-gradient(1px   1px   at 8%  82%, rgba(196,126,26,0.25) 0%, transparent 100%),
radial-gradient(1px   1px   at 72% 88%, rgba(155,78,110,0.2)  0%, transparent 100%),
radial-gradient(1px   1px   at 38% 93%, rgba(42,122,106,0.2)  0%, transparent 100%);
}

/* ── HEADER ── */
header {
position: relative; z-index: 10;
text-align: center;
padding: 3.5rem 1rem 1.5rem;
border-bottom: 1px solid var(–border);
background: linear-gradient(180deg, rgba(26,42,74,0.06) 0%, transparent 100%);
}
.header-eyebrow {
font-family: ‘Cinzel’, serif;
font-size: 0.65rem;
letter-spacing: 0.3em;
color: var(–peacock);
text-transform: uppercase;
margin-bottom: 0.75rem;
}
header h1 {
font-family: ‘Cormorant Garamond’, serif;
font-size: clamp(2.4rem, 6vw, 4rem);
font-weight: 300;
letter-spacing: 0.06em;
color: var(–deep);
line-height: 1;
}
header h1 span {
font-style: italic;
color: var(–flute);
}
.header-sub {
font-family: ‘Crimson Pro’, serif;
font-size: 0.95rem;
color: var(–muted);
margin-top: 0.6rem;
letter-spacing: 0.08em;
}

/* ── LAYOUT ── */
.container {
position: relative; z-index: 5;
display: grid;
grid-template-columns: 260px 1fr;
gap: 0;
max-width: 1100px;
margin: 0 auto;
min-height: calc(100vh - 160px);
}

/* ── SIDEBAR ── */
.sidebar {
background: var(–sidebar);
border-right: 1px solid var(–border);
padding: 2rem 0;
position: sticky;
top: 0;
height: calc(100vh - 160px);
overflow-y: auto;
scrollbar-width: thin;
scrollbar-color: rgba(26,42,74,0.2) transparent;
}
.sidebar-title {
font-family: ‘Cinzel’, serif;
font-size: 0.6rem;
letter-spacing: 0.25em;
color: var(–muted);
text-transform: uppercase;
padding: 0 1.5rem 1rem;
}
.song-btn {
display: block;
width: 100%;
text-align: left;
background: none;
border: none;
cursor: pointer;
padding: 0.7rem 1.5rem;
font-family: ‘Crimson Pro’, serif;
font-size: 1rem;
color: var(–muted);
transition: color 0.2s, background 0.2s, border-color 0.2s;
border-left: 3px solid transparent;
line-height: 1.3;
}
.song-btn:hover {
color: var(–deep);
background: rgba(26,42,74,0.06);
border-left-color: rgba(42,122,106,0.4);
}
.song-btn.active {
color: var(–deep);
background: rgba(26,42,74,0.09);
border-left-color: var(–peacock);
font-weight: 400;
}
.song-btn .tag {
display: block;
font-size: 0.62rem;
font-family: ‘Cinzel’, serif;
letter-spacing: 0.12em;
color: var(–peacock);
opacity: 0.75;
margin-top: 0.15rem;
text-transform: uppercase;
}
.song-btn.active .tag { opacity: 1; color: var(–rose); }

/* ── MAIN PANEL ── */
.main-panel {
padding: 2.5rem 3rem;
position: relative;
background: var(–sand);
}

.lyric-card {
display: none;
animation: fadeUp 0.4s ease forwards;
}
.lyric-card.active { display: block; }

@keyframes fadeUp {
from { opacity: 0; transform: translateY(10px); }
to   { opacity: 1; transform: translateY(0); }
}

.song-header {
margin-bottom: 2rem;
padding-bottom: 1.5rem;
border-bottom: 2px solid rgba(26,42,74,0.12);
}
.song-number {
font-family: ‘Cinzel’, serif;
font-size: 0.58rem;
letter-spacing: 0.3em;
color: var(–peacock);
opacity: 0.7;
margin-bottom: 0.4rem;
text-transform: uppercase;
}
.song-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: clamp(1.8rem, 4vw, 2.8rem);
font-weight: 400;
color: var(–deep);
line-height: 1.15;
}
.song-title em { color: var(–flute); font-style: italic; }
.song-type {
font-family: ‘Cinzel’, serif;
font-size: 0.62rem;
letter-spacing: 0.22em;
color: var(–rose);
text-transform: uppercase;
margin-top: 0.5rem;
}

/* ── LYRICS BODY ── */
.lyrics {
font-size: 1.35rem;
line-height: 2.1;
color: var(–text);
font-weight: 400;
}
.lyrics p { margin-bottom: 0.1rem; }
.lyrics .stanza { margin-bottom: 1.8rem; }

.lyrics .chorus {
padding: 1rem 1.6rem;
border-left: 3px solid var(–flute2);
background: rgba(196,126,26,0.07);
margin: 1.4rem 0;
font-style: italic;
color: var(–deep);
font-size: 1.35rem;
line-height: 2.1;
border-radius: 0 4px 4px 0;
}
.lyrics .chant {
font-family: ‘Cormorant Garamond’, serif;
font-size: 1.38rem;
font-style: italic;
color: var(–rose);
line-height: 2;
letter-spacing: 0.03em;
}
.lyrics .annotation {
font-size: 0.72rem;
font-family: ‘Cinzel’, serif;
letter-spacing: 0.16em;
color: var(–peacock);
text-transform: uppercase;
margin-bottom: 0.4rem;
margin-top: 0.2rem;
display: block;
}
.lyrics .timestamp {
font-size: 0.75rem;
color: var(–muted);
font-family: ‘Crimson Pro’, serif;
margin-right: 0.6rem;
letter-spacing: 0.04em;
}
.lyrics .note {
font-size: 0.85rem;
color: var(–muted);
font-style: italic;
padding: 0.8rem 1rem;
border: 1px dashed rgba(26,42,74,0.2);
margin-top: 1.5rem;
background: rgba(26,42,74,0.03);
border-radius: 2px;
}

/* ── NAV ARROWS ── */
.nav-row {
display: flex;
justify-content: space-between;
align-items: center;
margin-top: 3rem;
padding-top: 1.5rem;
border-top: 1px solid var(–border);
}
.nav-btn {
background: none;
border: 1px solid rgba(26,42,74,0.25);
color: var(–muted);
font-family: ‘Cinzel’, serif;
font-size: 0.62rem;
letter-spacing: 0.2em;
text-transform: uppercase;
padding: 0.6rem 1.2rem;
cursor: pointer;
transition: all 0.2s;
border-radius: 2px;
}
.nav-btn:hover:not(:disabled) {
color: var(–deep);
border-color: var(–peacock);
background: rgba(42,122,106,0.06);
}
.nav-btn:disabled { opacity: 0.2; cursor: default; }
.nav-counter {
font-family: ‘Cinzel’, serif;
font-size: 0.6rem;
letter-spacing: 0.2em;
color: var(–muted);
}

/* ── MOBILE ── */
.mobile-toggle {
display: none;
position: fixed;
bottom: 1.5rem; right: 1.5rem;
z-index: 200;
background: var(–deep);
border: none;
color: var(–flute2);
font-family: ‘Cinzel’, serif;
font-size: 0.6rem;
letter-spacing: 0.15em;
text-transform: uppercase;
padding: 0.7rem 1.1rem;
cursor: pointer;
border-radius: 2px;
box-shadow: 0 2px 16px rgba(26,42,74,0.35);
}

@media (max-width: 720px) {
/* Stack: sidebar hidden by default, main always visible */
.container {
grid-template-columns: 1fr;
display: block;
}

```

  display: block;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;

  background: var(--sidebar);
  height: 100vh;
  padding-top: 3rem;

  transform: translateX(-100%);

}

  display: block;

  position: relative;
  z-index: 1;
}

.mobile-toggle { display: block; }

header {
  padding: 1.5rem 1rem 1rem;
}
header h1 { font-size: 2rem; }
.header-sub { font-size: 0.8rem; }

.song-title { font-size: 1.6rem; }
.lyrics { font-size: 1.1rem; line-height: 1.95; }
.lyrics .chorus { font-size: 1.1rem; }
.lyrics .chant { font-size: 1.1rem; }

/* Dim overlay behind open sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 140;
  background: rgba(26,42,74,0.4);
}
.sidebar-overlay.open { display: block; }

        <p>Govinda Hari Govinda … Govinda Hari Govinda</p>

    type: "HUMS · Dashaavataara",
    body: `
      <div class="stanza">
        <span class="annotation">The Ten Avatars</span>
        <p>Ocean Liner Avatara</p>
        <p>Mountain Lifter Avatara</p>
        <p>Earth Lifter Avatara</p>

    `
  }
];

// ── BUILD DOM ──
const sidebar = document.getElementById('sidebar');
const mainPanel = document.getElementById('mainPanel');
let current = 0;

songs.forEach((s, i) => {
  // Sidebar button
  const btn = document.createElement('button');
  btn.className = 'song-btn' + (i === 0 ? ' active' : '');
  btn.innerHTML = `${s.title}<span class="tag">${s.type}</span>`;
  btn.addEventListener('click', () => { activate(i); closeSidebar(); });
  sidebar.appendChild(btn);

  // Card
  const card = document.createElement('div');
  card.className = 'lyric-card' + (i === 0 ? ' active' : '');
  card.innerHTML = `
    <div class="song-header">
      <div class="song-number">Track ${String(i+1).padStart(2,'0')} of ${songs.length}</div>
      <div class="song-title">${s.title}<br><em style="font-size:0.6em; font-weight:300; opacity:0.7">${s.subtitle}</em></div>
      <div class="song-type">${s.type}</div>
    </div>
    <div class="lyrics">${s.body}</div>
    <div class="nav-row">
      <button class="nav-btn" onclick="navigate(-1)" ${i===0?'disabled':''}>← Prev</button>
      <span class="nav-counter">${i+1} / ${songs.length}</span>
      <button class="nav-btn" onclick="navigate(1)" ${i===songs.length-1?'disabled':''}>Next →</button>
    </div>
  `;
  mainPanel.appendChild(card);
});

function activate(i) {
  const btns = sidebar.querySelectorAll('.song-btn');
  const cards = mainPanel.querySelectorAll('.lyric-card');
  btns[current].classList.remove('active');
  cards[current].classList.remove('active');
  current = i;
  btns[current].classList.add('active');
  cards[current].classList.add('active');
  mainPanel.scrollTop = 0;
  // Rebuild nav buttons (disabled state)
  cards[current].querySelectorAll('.nav-btn').forEach((btn, j) => {
    btn.disabled = j === 0 ? current === 0 : current === songs.length - 1;
  });
  const counter = cards[current].querySelector('.nav-counter');
  if (counter) counter.textContent = `${current+1} / ${songs.length}`;
}

function navigate(dir) {
  const next = current + dir;
  if (next >= 0 && next < songs.length) activate(next);
}

// Mobile sidebar toggle
const toggle = document.getElementById('mobileToggle');
const overlay = document.getElementById('sidebarOverlay');

function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
  toggle.textContent = '☰ Songs';
}
toggle.addEventListener('click', () => {
  const open = sidebar.classList.toggle('open');
  overlay.classList.toggle('open', open);
  toggle.textContent = open ? '✕ Close' : '☰ Songs';
});
overlay.addEventListener('click', closeSidebar);

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
});
</script>

</html>
