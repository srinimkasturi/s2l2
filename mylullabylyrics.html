<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lullabies · HUMS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sand:    #f0ebe0;
    --sand2:   #e8e1d3;
    --deep:    #1a2a4a;
    --flute:   #c47e1a;
    --flute2:  #e8a020;
    --peacock: #2a7a6a;
    --rose:    #9b4e6e;
    --text:    #1e1a14;
    --muted:   #6a5f50;
    --border:  rgba(36,70,110,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--sand);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 18px;
    min-height: 100vh;
    padding-bottom: 130px;
  }
  header {
    text-align: center;
    padding: 2.5rem 1rem 1.2rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(26,42,74,0.05) 0%, transparent 100%);
  }
  .header-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    color: var(--peacock);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 7vw, 3.6rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--deep);
    line-height: 1;
  }
  header h1 span { font-style: italic; color: var(--flute); }
  .header-sub {
    font-family: 'Crimson Pro', serif;
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 0.5rem;
    letter-spacing: 0.07em;
  }
  .main-panel {
    max-width: 700px;
    margin: 0 auto;
    padding: 2rem 1.4rem 1rem;
  }
  .lyric-card { display: none; }
  .lyric-card.active {
    display: block;
    animation: fadeUp 0.3s ease forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .song-header {
    margin-bottom: 1.8rem;
    padding-bottom: 1.2rem;
    border-bottom: 2px solid rgba(26,42,74,0.1);
  }
  .song-number {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.3em;
    color: var(--peacock);
    opacity: 0.7;
    margin-bottom: 0.3rem;
    text-transform: uppercase;
  }
  .song-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 400;
    color: var(--deep);
    line-height: 1.15;
  }
  .song-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    font-style: italic;
    color: var(--flute);
    font-weight: 300;
    margin-top: 0.2rem;
  }
  .song-type {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.22em;
    color: var(--rose);
    text-transform: uppercase;
    margin-top: 0.4rem;
  }
  .lyrics { font-size: 1.15rem; line-height: 2; color: var(--text); font-weight: 400; }
  .lyrics p { margin-bottom: 0.05rem; }
  .lyrics .stanza { margin-bottom: 1.6rem; }
  .lyrics .chorus {
    padding: 0.9rem 1.4rem;
    border-left: 3px solid var(--flute2);
    background: rgba(196,126,26,0.07);
    margin: 1.2rem 0;
    font-style: italic;
    color: var(--deep);
    border-radius: 0 4px 4px 0;
  }
  .lyrics .chant {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-style: italic;
    color: var(--rose);
    line-height: 2;
    letter-spacing: 0.03em;
  }
  .lyrics .annotation {
    font-size: 0.68rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.16em;
    color: var(--peacock);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
    margin-top: 0.6rem;
    display: block;
  }
  .lyrics .timestamp {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'Crimson Pro', serif;
    margin-right: 0.5rem;
  }
  .lyrics .note {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    padding: 0.7rem 1rem;
    border: 1px dashed rgba(26,42,74,0.18);
    margin-top: 1.2rem;
    background: rgba(26,42,74,0.02);
    border-radius: 2px;
  }
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    background: none;
    border: 1px solid rgba(26,42,74,0.22);
    color: var(--muted);
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.55rem 1rem;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }
  .nav-btn:hover:not(:disabled) { color: var(--deep); border-color: var(--peacock); }
  .nav-btn:disabled { opacity: 0.18; cursor: default; }
  .nav-counter {
    font-family: 'Cinzel', serif;
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    color: var(--muted);
  }
  footer {
    text-align: center;
    padding: 1rem;
    border-top: 1px solid var(--border);
    background: var(--sand2);
  }
  .footer-copy {
    font-family: 'Cinzel', serif;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .footer-copy a { color: var(--peacock); text-decoration: none; }
  .footer-copy a:hover { color: var(--flute); }
  .song-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--deep);
    border-top: 2px solid rgba(232,160,32,0.3);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    padding: 0.45rem 0.5rem 0.55rem;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .song-bar::-webkit-scrollbar { display: none; }
  .bar-label {
    font-family: 'Cinzel', serif;
    font-size: 0.45rem;
    letter-spacing: 0.22em;
    color: rgba(232,160,32,0.45);
    text-transform: uppercase;
    display: block;
    text-align: center;
    margin-bottom: 0.25rem;
  }
  .bar-links {
    display: flex;
    gap: 0.2rem;
    padding: 0 0.3rem;
  }
  .song-link {
    background: none;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: 'Crimson Pro', serif;
    font-size: 0.82rem;
    color: rgba(232,224,208,0.6);
    padding: 0.28rem 0.65rem;
    border-radius: 2px;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .song-link:hover { color: var(--flute2); }
  .song-link.active {
    color: var(--flute2);
    background: rgba(232,160,32,0.12);
    border-color: rgba(232,160,32,0.25);
  }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">HUMS &middot; Creative Works</div>
  <h1><span>Lullabies</span></h1>
  <div class="header-sub">Vedanta inside nursery rhymes &middot; Encoded 2024</div>
</header>

<div class="inspiration">
  <div class="inspiration-icon">&#9835;</div>
  <div class="inspiration-text">

    <div class="inspiration-sub">featuring Peter White &middot; Rick Braun &middot; Dave Koz &middot; Norman Brown &amp; more</div>
  </div>
  <a class="inspiration-link" href="https://www.amazon.com/dp/B00005NNMX" target="_blank" rel="noopener">&#8599;&nbsp; View Album</a>
</div>

<main class="main-panel" id="mainPanel"></main>

<footer>
  <div class="footer-copy">
    &copy; 2024 Srinivasa M. Kasturi &nbsp;&middot;&nbsp;
    <a href="mailto:srini.m.kasturi@gmail.com">srini.m.kasturi@gmail.com</a>

  </div>
</footer>

<div class="song-bar" id="songBar">
  <span class="bar-label">Songs</span>
  <div class="bar-links" id="barLinks"></div>
</div>

<script>

function renderVerse(v) {
  var h = '';
  if (v.chant) {
    h += '<div class="stanza">';
    for (var i=0;i<v.chant.length;i++) h += v.chant[i]==='' ? '<br>' : '<p class="chant">'+v.chant[i]+'</p>';
    h += '</div>';
  } else if (v.avatars) {
    h += '<div class="stanza">';
    for (var i=0;i<v.avatars.length;i++) h += '<span class="annotation">'+v.avatars[i][0]+'</span><p class="chant">'+v.avatars[i][1]+'</p>';
    h += '</div>';
  } else if (v.chorus) {
    h += '<div class="chorus">'+v.chorus.join('<br>')+'</div>';
  } else if (v.note) {
    h += '<div class="note">'+v.note+'</div>';
  } else {
    h += '<div class="stanza">';
    if (v.annotation) h += '<span class="annotation">'+v.annotation+'</span>';
    if (v.lines) for (var i=0;i<v.lines.length;i++) {
      var l=v.lines[i], inner=(l.ts?'<span class="timestamp">'+l.ts+'</span>':'')+(l.em?'<em>'+l.t+'</em>':l.t);
      h += l.chant ? '<p class="chant">'+inner+'</p>' : '<p>'+inner+'</p>';
    }
    h += '</div>';
  }
  return h;
}

var panel = document.getElementById('mainPanel');
var bar   = document.getElementById('barLinks');
var cur   = 0;

for (var i=0;i<songs.length;i++) {
  (function(idx){
    var s = songs[idx];
    var lh = '';
    for (var j=0;j<s.verses.length;j++) lh += renderVerse(s.verses[j]);
    var n = songs.length;
    var attrHtml = '';
    if (s.attribution) {
      attrHtml = '<a class="attribution" href="'+s.attribution.url+'" target="_blank" rel="noopener">'+
        '<span class="attr-icon">&#8599;</span>'+
        '<span class="attr-label">Source</span>&nbsp;&nbsp;'+s.attribution.label+
        '</a>';
    }
    var card = document.createElement('div');
    card.className = 'lyric-card' + (idx===0?' active':'');
    card.innerHTML =
      '<div class="song-header">'+
        '<div class="song-number">Track '+String(idx+1).padStart(2,'0')+' of '+n+'</div>'+
        '<div class="song-title">'+s.title+'</div>'+
        '<div class="song-subtitle">'+s.subtitle+'</div>'+
        '<div class="song-type">'+s.type+'</div>'+
        attrHtml+
      '</div>'+
      '<div class="lyrics">'+lh+'</div>'+
      '<div class="nav-row">'+
        '<button class="nav-btn" id="pb'+idx+'" onclick="navigate(-1)"'+(idx===0?' disabled':'')+'>&#8592; Prev</button>'+
        '<span class="nav-counter" id="nc'+idx+'">'+(idx+1)+' / '+n+'</span>'+
        '<button class="nav-btn" id="nb'+idx+'" onclick="navigate(1)"'+(idx===n-1?' disabled':'')+'>Next &#8594;</button>'+
      '</div>';
    panel.appendChild(card);

    var link = document.createElement('button');
    link.className = 'song-link'+(idx===0?' active':'');
    link.textContent = s.title;
    link.onclick = function(){ activate(idx); };
    bar.appendChild(link);
  })(i);
}

function activate(i) {
  var cards = panel.querySelectorAll('.lyric-card');
  var links = bar.querySelectorAll('.song-link');
  cards[cur].classList.remove('active');
  links[cur].classList.remove('active');
  cur = i;
  cards[cur].classList.add('active');
  links[cur].classList.add('active');
  document.getElementById('pb'+i).disabled = (i===0);
  document.getElementById('nb'+i).disabled = (i===songs.length-1);
  window.scrollTo({top:0,behavior:'smooth'});
  links[cur].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
}

function navigate(dir) {
  var n = cur+dir;
  if (n>=0 && n<songs.length) activate(n);
}

document.addEventListener('keydown', function(e){
  if (e.key==='ArrowRight'||e.key==='ArrowDown') navigate(1);
  if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   navigate(-1);
});
</script>

</html>
